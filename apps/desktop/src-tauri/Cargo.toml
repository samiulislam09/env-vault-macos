[package]
name = "localvault-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LocalVault desktop application (Tauri 2)"

[lib]
name = "localvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
localvault-core = { workspace = true }
localvault-crypto = { workspace = true }
localvault-storage = { workspace = true }
localvault-vault = { workspace = true }
localvault-projects = { workspace = true }
localvault-environments = { workspace = true }
localvault-variables = { workspace = true }
localvault-io = { workspace = true }
localvault-backup = { workspace = true }

tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17"
base64 = "0.22"
uuid = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
