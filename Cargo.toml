[workspace]
members = [
    "apps/desktop/src-tauri",
    "apps/cli",
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/vault",
    "crates/projects",
    "crates/environments",
    "crates/variables",
    "crates/io",
    "crates/backup",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SeloraX"]
license = "MIT"

[workspace.dependencies]
# Internal crates
localvault-core = { path = "crates/core" }
localvault-crypto = { path = "crates/crypto" }
localvault-storage = { path = "crates/storage" }
localvault-vault = { path = "crates/vault" }
localvault-projects = { path = "crates/projects" }
localvault-environments = { path = "crates/environments" }
localvault-variables = { path = "crates/variables" }
localvault-io = { path = "crates/io" }
localvault-backup = { path = "crates/backup" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Cryptography
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"

# IDs & data
uuid = { version = "1", features = ["v4", "serde"] }
base32 = "0.5"

# Error handling
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Filesystem
fs2 = "0.4"
tempfile = "3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package.argon2]
opt-level = 3
